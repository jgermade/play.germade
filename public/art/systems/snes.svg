    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#42a5f5"/><stop offset=".55" stop-color="#7e57c2"/><stop offset="1" stop-color="#ec407a"/></linearGradient>
