<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f7f9"/><stop offset="1" stop-color="#d8d8de"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18191e"/><stop offset="1" stop-color="#09090c"/></linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22302f"/><stop offset="1" stop-color="#121b1a"/></linearGradient>
    <radialGradient id="pad" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#3a3b42"/><stop offset="1" stop-color="#1e1f24"/></radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#shell)"/>
  <!-- the shell's rounded corner and shoulder seam -->
  <path d="M-20 30 Q 0 6 40 4 H 220" fill="none" stroke="#c3c3cb" stroke-width="2"/>
  <path d="M-20 32 Q 0 8 40 6 H 220" fill="none" stroke="#fff"/>
  <!-- screen: glass and LCD, bleeding off the right -->
  <rect x="112" y="34" width="120" height="112" rx="14" fill="url(#glass)"/>
  <rect x="126" y="48" width="110" height="84" rx="2" fill="url(#lcd)"/>
  <g fill="#7fd6c2" opacity=".55"><rect x="134" y="118" width="70" height="3"/><rect x="146" y="104" width="8" height="14"/><rect x="172" y="92" width="5" height="5"/><rect x="182" y="86" width="5" height="5"/></g>
  <path d="M112 34h60l-60 112z" fill="#fff" opacity=".04"/>
  <circle cx="122" cy="44" r="2" fill="#43d17a"/>
  <!-- d-pad -->
  <circle cx="54" cy="96" r="38" fill="#e4e4ea"/>
  <circle cx="54" cy="96" r="38" fill="none" stroke="#fff"/>
  <g fill="url(#pad)"><rect x="44" y="64" width="20" height="64" rx="4"/><rect x="22" y="86" width="64" height="20" rx="4"/></g>
  <circle cx="54" cy="96" r="5" fill="#1a1b20"/>
  <g fill="#fff" fill-opacity=".08"><rect x="46" y="66" width="16" height="4" rx="2"/></g>
  <!-- start / select -->
  <rect x="34" y="152" width="22" height="8" rx="4" fill="#a3a3ac"/>
  <rect x="34" y="168" width="22" height="8" rx="4" fill="#a3a3ac"/>
  <!-- speaker -->
  <g fill="#bdbdc5"><circle cx="150" cy="170" r="2"/><circle cx="160" cy="170" r="2"/><circle cx="170" cy="170" r="2"/><circle cx="155" cy="178" r="2"/><circle cx="165" cy="178" r="2"/><circle cx="160" cy="162" r="2"/></g>
</svg>
