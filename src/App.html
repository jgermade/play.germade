<script :setup="{ rows, library, shell, refresh, uninstall, onAction, Hero, Notice, RomDrawer, roms, romLibrary }">
  // Focus restored when coming back from a route (?focus=<slug>), else the first tile.
  const focusOf = (slug) => {
    for (const [r, row] of rows.entries()) {
      const c = row.games.findIndex((g) => g.slug === slug)
      if (c >= 0) return { row: r, col: c }
    }
    return { row: 0, col: 0 }
  }
  let focus = focusOf(new URLSearchParams(location.search).get('focus'))
  let dialog = null        // { type: 'notice', game }
  // The panel under a tile's grid line: a game's details ('info'), or a console's ROM
  // drawer ('drawer'). `after` is the last tile of that line; the panel goes right after it.
  // A game's panel holds its details; a console's, its ROM drawer.
  let details = null       // { slug, row, after, notch }
  // The arrows can go down into the panel: a game's focused button (index, or null), or a
  // console's drawer (`inDrawer`, which then takes the keys).
  let actionFocus = null
  let inDrawer = false

  const narrow = matchMedia('(max-width: 760px)') // a phone: the page scrolls by touch

  $: current = rows[focus.row]?.games[focus.col] ?? null

  // Ambient backdrop: the focused item's art, blurred, cross-faded. Two layers at most.
  let backdrops = []
  let backdropKey = null
  $: {
    const src = current?.banner ?? current?.cover ?? current?.art ?? null
    backdropKey = src
    if (src && !backdrops.some((b) => b.key === src)) {
      backdrops = [...backdrops.slice(-1), { key: src, src, illustration: !current?.banner && !current?.cover }]
    }
  }

  const initials = (title) => title.split(/\s+/).filter((w) => /[A-Za-z0-9]/.test(w)).slice(0, 2).map((w) => w[0]).join('').toUpperCase()
  const romCount = (game) => roms[game.system]?.games?.length ?? 0

  const isInstalled = (game) => !!library.installed[game.slug]

  // Every game and system has its own page. The tile's art is named for the view
  // transition, so it morphs into the page's splash; the URL keeps the focus for the way back.
  const go = (game, url) => {
    const card = $self(`[data-slug="${game.slug}"]`)
    if (card) card.style.viewTransitionName = `art-${game.slug}`
    history.replaceState(null, '', `/?focus=${encodeURIComponent(game.slug)}`)
    location.assign(url)
  }
  const play = (game) => go(game, `/${game.slug}/`)

  // A ROM from the drawer: the system's page with the game (and version) in the query.
  const playRom = ({ detail }) => {
    const system = rows.flatMap((r) => r.games).find((g) => g.system === detail.system)
    const q = new URLSearchParams({ game: detail.gameId, version: detail.sha1.slice(0, 8) })
    if (detail.patch) q.set('patch', detail.patch.slice(0, 8))
    go(system, `/${system.slug}/?${q}`)
  }

  // Every row is a grid; its column count is whatever the CSS fitted in.
  const colsOf = (r) => {
    const cards = $$self('.cards')[r]
    return cards ? Math.max(1, getComputedStyle(cards).gridTemplateColumns.split(' ').length) : 1
  }

  // The panel opens under the grid line that holds the tile, the notch pointing at it
  // (it is the grid's last item, placed with `order`).
  const place = (r, c, scroll = true) => {
    const game = rows[r]?.games[c]
    if (!game) return
    const card = $self(`[data-slug="${game.slug}"]`)
    const cards = card?.closest('.cards')
    const cols = colsOf(r)
    const after = Math.min(rows[r].games.length - 1, Math.floor(c / cols) * cols + cols - 1)
    const notch = card && cards
      ? card.getBoundingClientRect().left - cards.getBoundingClientRect().left + card.offsetWidth / 2
      : 60
    details = { slug: game.slug, row: r, after, notch }
    actionFocus = null
    inDrawer = false
    // Once the panel is in the page and done unfolding (240ms), bring all of it into view.
    // (On a phone; on desktop the page is anchored to the focused line instead, see `anchor()`.)
    if (scroll && narrow.matches) setTimeout(() => $self('.tile-details')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 260)
  }
  // A game's panel's enabled buttons, in order: the main action, then Quitar datos.
  const actionsOf = (game) => {
    if (!game || game.kind === 'emulator') return []
    if (game.status !== 'ready') return []
    return isInstalled(game) ? ['Jugar', 'Quitar datos'] : ['Instalar']
  }
  const press = (game, index) => {
    if (actionsOf(game)[index] === 'Quitar datos') { uninstall(game); actionFocus = 0 }
    else open(game)
  }
  $: detailsGame = details ? rows[details.row]?.games.find((g) => g.slug === details.slug) ?? null : null
  $: drawerGames = detailsGame?.kind === 'emulator' ? [detailsGame] : []

  // Into the open panel, from its tile: a console's drawer, or a game's first button.
  const enterPanel = () => {
    if (!detailsGame) return false
    if (detailsGame.kind === 'emulator') {
      // Next tick: the drawer hears this same key too, and must not act on it.
      setTimeout(() => { inDrawer = true })
    }
    else if (actionsOf(detailsGame).length) actionFocus = 0
    else return false
    if (narrow.matches) $self('.tile-details')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
    return true
  }
  // The drawer hands the keys back at its edges.
  const leaveDrawer = () => { inDrawer = false }
  // ↓ from the drawer's last line: on to the next line, if there is one (else stay in the drawer).
  const drawerNext = () => { if (move(1, 0)) inDrawer = false }

  const closePanel = () => { details = null; actionFocus = null; inDrawer = false }
  // A click selects the tile and opens its panel; on the selected one, it closes it.
  const tap = (game, r, c) => {
    select(r, c)
    if (details?.slug === game.slug) closePanel()
    else place(r, c)
  }

  // A game's main button: play (the page asks for the files if needed), or the notice.
  const open = (game) => {
    if (!game || game.kind === 'emulator') return
    if (game.status !== 'ready') dialog = { type: 'notice', game }
    else play(game) // the page itself asks for the files if they are not installed
  }

  const select = (row, col) => {
    focus = { row, col }
  }

  // The arrows walk the grids: left/right along the tiles, up/down one grid line, keeping
  // the column, from a row's last line into the next row's first (and back).
  const move = (dRow, dCol) => {
    let { row, col } = focus
    const size = rows[row].games.length
    if (dCol) col = Math.min(size - 1, Math.max(0, col + dCol))
    else {
      const cols = colsOf(row)
      const line = Math.floor(col / cols)
      const lastLine = Math.floor((size - 1) / cols)
      if (dRow > 0 && line < lastLine) col = Math.min(size - 1, col + cols)
      else if (dRow < 0 && line > 0) col -= cols
      else {
        const next = row + dRow
        if (next < 0 || next >= rows.length) return false
        const nextSize = rows[next].games.length
        const nextCols = colsOf(next)
        const start = dRow > 0 ? 0 : Math.floor((nextSize - 1) / nextCols) * nextCols
        row = next
        col = Math.min(nextSize - 1, start + (col % cols))
      }
    }
    if (row === focus.row && col === focus.col) return false
    focus = { row, col }
    // An open panel follows the selection, as the hero used to.
    if (details) place(row, col)
    return true
  }

  onAction((action) => {
    if (dialog) {
      if (action === 'back') dialog = null
      return
    }
    // Inside a console's drawer the keys are its own; it says when to leave or close.
    if (inDrawer) return
    // In a panel's buttons: ← → between them, ↑ back to the tile, ↓ on to the next line.
    if (actionFocus !== null && detailsGame) {
      const count = actionsOf(detailsGame).length
      if (action === 'left') actionFocus = Math.max(0, actionFocus - 1)
      else if (action === 'right') actionFocus = Math.min(count - 1, actionFocus + 1)
      else if (action === 'up') actionFocus = null
      else if (action === 'down') { actionFocus = null; move(1, 0) }
      else if (action === 'back') actionFocus = null
      else if (action === 'accept') press(detailsGame, actionFocus)
      return
    }
    // ↓ from a tile with its panel open: into the panel (buttons or drawer), if there is anything.
    if (action === 'down' && details?.slug === current?.slug && enterPanel()) return
    if (action === 'up') move(-1, 0)
    else if (action === 'down') move(1, 0)
    else if (action === 'left') move(0, -1)
    else if (action === 'right') move(0, 1)
    else if (action === 'back') closePanel()
    else if (action === 'accept' && current) {
      if (details?.slug !== current.slug) place(focus.row, focus.col)
      else if (current.kind === 'emulator') enterPanel()
      else open(current)
    }
  })

  // The grid's columns change with the width: the open panel moves to its tile's new line.
  let resizeFrame = 0
  const onResize = () => {
    cancelAnimationFrame(resizeFrame)
    resizeFrame = requestAnimationFrame(() => {
      if (!details) return
      const c = rows[details.row].games.findIndex((g) => g.slug === details.slug)
      if (c >= 0) place(details.row, c)
    })
  }
  window.addEventListener('resize', onResize)
  $destroyed(() => window.removeEventListener('resize', onResize))

  // Back from a route through bfcache: the page is as it was; refresh what may have changed.
  window.addEventListener('pageshow', (event) => {
    if (!event.persisted) return
    for (const card of $$self('.card')) card.style.viewTransitionName = ''
    refresh()
    for (const system of rows.flatMap((r) => r.games).filter((g) => g.system)) romLibrary.load(system.system)
  })

  await refresh()
  for (const system of rows.flatMap((r) => r.games).filter((g) => g.system)) romLibrary.load(system.system)
  await $mounted()
  // The selected tile's panel is open from the start — scrolled into view only when coming
  // back from a page (?focus=), so a plain load stays at the top.
  requestAnimationFrame(() => place(focus.row, focus.col, new URLSearchParams(location.search).has('focus')))

  // What Enter does now: the focused button, a ROM in the drawer, or the tile's main action.
  $: hintAccept = !current ? ''
    : actionFocus !== null && detailsGame ? actionsOf(detailsGame)[actionFocus] ?? ''
    : inDrawer ? 'Jugar'
    : current.kind === 'emulator' ? 'Abrir'
    : details?.slug !== current.slug ? 'Detalles'
    : current.status !== 'ready' ? 'Próximamente'
    : isInstalled(current) ? 'Jugar' : 'Instalar'

  // Keep the focused tile in view whenever the focus moves.
  // Desktop: the focused line always sits where the first line sits at the top of the page, so
  // the tiles keep their height on screen whatever the size of the panel under them.
  const anchor = (behavior = 'smooth') => {
    const tile = $self('.card.is-focused')?.closest('.tile')
    const first = $self('.tile')
    if (!tile || !first) return
    // The page offset that puts this line where the first one is at scroll 0.
    const top = tile.getBoundingClientRect().top - first.getBoundingClientRect().top
    if (Math.abs(top - scrollY) > 1) window.scrollTo({ top, behavior })
  }
  $: focus, requestAnimationFrame(() => {
    if (!narrow.matches) return anchor()
    $self('.card.is-focused')?.closest('.tile')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
  })
</script>

<div class="backdrop" :style="`--accent: ${current?.accent ?? '#334155'}`" aria-hidden="true">
  <img :each="layer in backdrops" :key="layer.key" class="backdrop-art" :class.is-current="layer.key === backdropKey"
       :class.is-illustration="layer.illustration" :src="layer.src" alt="" />
  <div class="backdrop-tint"></div>
</div>

<div class="launcher">
  <header class="topbar">
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="9" />
        <path d="M13 10.5v11l9-5.5z" />
      </svg>
      <span>play<b>.germade</b></span>
    </span>
    <a class="topbar-link" href="/roms/">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.6"/><rect x="11" y="3" width="6" height="6" rx="1.6"/><rect x="3" y="11" width="6" height="6" rx="1.6"/><rect x="11" y="11" width="6" height="6" rx="1.6"/></svg>
      Biblioteca
    </a>
  </header>

  <section class="rows">
    <div class="row" :each="row, r in rows" :key="row.id" :class.is-active="focus.row === r">
      <h2 class="row-title">{{ row.title }}<span class="row-count">{{ row.games.length }}</span></h2>
      <ul class="cards">
        <li :each="game, c in row.games" :key="game.slug" class="tile" :style="`order: ${c * 2}`"
            :class.is-focused="focus.row === r && focus.col === c">
          <button class="card" :data-slug="game.slug"
                  :class.is-open="details?.slug === game.slug"
                  :class.is-focused="focus.row === r && focus.col === c"
                  :class.is-soon="game.status !== 'ready'"
                  :class.is-system="!game.cover && !game.tileArt && game.art"
                  :class.is-poster="!game.cover && !game.tileArt && !game.art"
                  :style="`--accent: ${game.accent ?? '#334155'}`"
                  :aria-label="game.title"
                  @focus="select(r, c)" @click="tap(game, r, c)">
            <img :if="game.cover" class="card-cover" :src="game.cover" alt="" loading="lazy" />
            <img :elseif="game.tileArt" class="card-cover" :src="game.tileArt" alt="" loading="lazy" />
            <img :elseif="game.art" class="card-art" :src="game.art" alt="" loading="lazy" />
            <span :else class="poster">
              <span class="poster-mark">{{ initials(game.title) }}</span>
              <span class="poster-title">{{ game.title }}</span>
            </span>
            <span class="card-shine"></span>
            <span :if="game.status !== 'ready'" class="pill is-soon">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7" fill="none"/></svg>
            </span>
            <span :elseif="game.kind === 'game' && isInstalled(game)" class="pill is-ok" title="Instalado">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.4l2.9 2.8 6-6.4" fill="none"/></svg>
            </span>
            <span :elseif="game.kind === 'emulator' && romCount(game)" class="pill is-count">{{ romCount(game) }}</span>
          </button>
          <span class="tile-caption">
            <span class="tile-title">{{ game.title }}</span>
            <span class="tile-meta">{{ game.kicker ?? (game.year ? `${game.year}` : game.engine) }}</span>
          </span>
        </li>
        <li :if="detailsGame && details.row === r" class="tile-details"
            :style="`order: ${details.after * 2 + 1}; --notch: ${details.notch}px`">
          <!-- Keyed by console: another console's drawer is a new one (its engines, its ROMs). -->
          <RomDrawer :each="g in drawerGames" :key="g.slug" :game="g" :roms :library="romLibrary" :onAction
                     :active="inDrawer" :edges="true"
                     @play="playRom" @close="leaveDrawer" @leave="leaveDrawer" @next="drawerNext" />
          <Hero :if="detailsGame.kind !== 'emulator'" :game="detailsGame" :installed="isInstalled(detailsGame)" :roms :focusAction="actionFocus" @open="open(detailsGame)"
                @uninstall="uninstall(detailsGame)" />
        </li>
      </ul>
    </div>
  </section>

  <footer class="hintbar">
    <span class="hint"><i class="key is-a">A</i><kbd>Enter</kbd> {{ hintAccept }}</span>
    <span :if="inDrawer" class="hint"><i class="key is-y">Y</i><kbd>V</kbd> Versiones</span>
    <span :if="details" class="hint"><i class="key is-b">B</i><kbd>Esc</kbd> {{ inDrawer || actionFocus !== null ? 'Atrás' : 'Cerrar' }}</span>
    <span class="hint is-nav"><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> Navegar</span>
  </footer>

  <div :if="dialog" class="dialog-backdrop" @click.self="dialog = null">
    <Notice :if="dialog.type === 'notice'" :game="dialog.game" @close="dialog = null" />
  </div>

  <div :if="shell.update" class="toast">
    Hay una versión nueva.
    <button @click="shell.update()">Actualizar</button>
  </div>
</div>
