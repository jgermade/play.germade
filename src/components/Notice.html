<script :setup="{ game, l10n }">
  const { t, tx } = l10n
  await $mounted()
  $self('button')?.focus()
</script>

<div class="dialog">
  <h2>{{ game.title }}</h2>
  <p>{{ tx(game.description) }}</p>
  <p :if="game.kind === 'emulator'">{{ t('notice.emulator') }}</p>
  <p :else>{{ t('notice.engine', { engine: game.engine }) }}</p>
  <div class="dialog-actions">
    <button class="primary" @click="$emit('close')">{{ t('notice.close') }}</button>
  </div>
</div>
