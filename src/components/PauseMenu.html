<script :setup="{ state, title, choose, label }"></script>

<div :if="state.open" class="pause-backdrop">
  <div class="pause" role="dialog" :aria-label="label('pause.title')">
    <p class="pause-kicker">{{ label('pause.title') }}</p>
    <h2>{{ title }}</h2>
    <p :if="state.error" class="error">{{ state.error }}</p>
    <button :each="item, i in state.items" :key="item" class="pause-item" :class.is-focused="i === state.focus"
            @mouseenter="state.focus = i" @click="choose(item)">{{ label(`pause.${item}`) }}</button>
    <p class="pause-hint">
      <span><i class="key is-a">A</i> {{ label('pause.choose') }}</span>
      <span :if="!state.error"><i class="key is-b">B</i> {{ label('pause.continue') }}</span>
    </p>
  </div>
</div>
