<script :setup="{ game, install }">
  // Phones map `accept` to MIME types; ROM extensions have none, and the native picker then
  // greys the files out. There, every file is shown and the import checks the extension.
  const coarse = matchMedia('(pointer: coarse)').matches
  let files = {}
  let busy = false
  let error = null

  $: entries = Object.entries(game.install ?? {})
  $: ready = entries.every(([key]) => files[key])

  const size = (file) => file.size >= 1048576 ? `${(file.size / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(file.size / 1024))} KB`

  const pick = (key, event) => {
    files = { ...files, [key]: event.target.files?.[0] ?? null }
    error = null
  }

  const submit = async () => {
    busy = true
    error = null
    try {
      await install(game, files)
      $emit('installed', game)
    } catch (e) {
      error = e.message ?? String(e)
    } finally {
      busy = false
    }
  }

  await $mounted()
  // Keyboard and pad land on the file field at once; a finger does not need it.
  if (!coarse) $self('input')?.focus()
</script>

<form class="dialog" @submit.prevent="submit">
  <h2>Instalar {{ game.title }}</h2>
  <p>
    Los datos del juego no se distribuyen: aportas tu copia y se queda en tu navegador,
    en <code>{{ game.engine }}/{{ game.slug }}/</code>. Las partidas se guardan al lado.
  </p>
  <!-- The browser's own file control stays in the label, hidden: the whole zone opens it. -->
  <label :each="entry in entries" :key="entry[0]" class="file" :class.is-picked="files[entry[0]]">
    <span class="file-label">{{ entry[1].label ?? entry[1].file }}</span>
    <span class="file-row">
      <svg class="file-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span class="file-name">
        {{ files[entry[0]] ? files[entry[0]].name : `Elegir ${entry[1].file ?? 'archivo'}` }}
        <small :if="files[entry[0]]">{{ size(files[entry[0]]) }}</small>
      </span>
      <span class="file-button">{{ files[entry[0]] ? 'Cambiar' : 'Elegir' }}</span>
    </span>
    <input class="file-input" type="file" :accept="coarse ? '' : (entry[1].accept ?? []).join(',')" @change="pick(entry[0], $event)" />
  </label>
  <p :if="error" class="error">{{ error }}</p>
  <div class="dialog-actions">
    <button type="button" class="ghost" @click="$emit('cancel')">Cancelar</button>
    <button type="submit" class="primary" :disabled="!ready || busy">{{ busy ? 'Instalando…' : 'Instalar y jugar' }}</button>
  </div>
</form>
