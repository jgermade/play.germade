<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Super Mario World</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      overflow: hidden;
    }

    .canvas-container {
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0px none;
      background-color: black;
    }

    .canvas-container .emscripten {
      /* Square-pixel SNES frame, like the upstream desktop port. Definite
         size (not just max-*): Emscripten's SDL2 consults the canvas CSS
         size, which must never compute to 0.
         --snes-w is the internal width in pixels, set from ?aspect= by the
         script below (398 = default 16:9; vanilla 4:3 is 256). It must stay
         in sync with the engine's g_snes_width. */
      aspect-ratio: calc(var(--snes-w, 398) / 224);
      width: min(100vw, calc(100vh * var(--snes-w, 398) / 224));
      display: block;
      margin: auto;
      max-width: 100%;
      max-height: 100%;
      outline: none;
      image-rendering: pixelated;
    }
  </style>
  <script>
    // Widescreen (?aspect=W:H, default 16:9): one build serves every ratio.
    // Mirrors the engine's config.c math exactly (square pixels, C integer
    // division): extra side pixels = (224*W/H - 256)/2, "4:3" = vanilla,
    // clamped to the PPU headroom (96/side = 18:9). The canvas CSS var here
    // and the smw.ini rewrite in onRuntimeInitialized must agree, or SDL's
    // drawing buffer and the engine's g_snes_width would diverge.
    var __aspect = (function () {
      var q = new URLSearchParams(window.location.search).get('aspect') || '';
      var m = /^(\d{1,2}):(\d{1,2})$/.exec(q);
      var w = m ? parseInt(m[1], 10) : 16;
      var h = m ? parseInt(m[2], 10) : 9;
      if (!(w > 0 && h > 0)) { w = 16; h = 9; }
      var extra = (w === 4 && h === 3) ? 0 :
        Math.min(Math.max(Math.trunc((Math.trunc(224 * w / h) - 256) / 2), 0), 96);
      return { w: w, h: h, snesWidth: 256 + 2 * extra };
    })();
    document.documentElement.style.setProperty('--snes-w', __aspect.snesWidth);

    // Optional debug flag (?rAF=60fps): replace requestAnimationFrame with a
    // 60fps setTimeout loop, bypassing VSync. For perf testing/QA only.
    if (window.location.search.includes('rAF=60fps')) {
      window.requestAnimationFrame = (function () {
        var frameDuration = 1000 / 60;
        var lastFrameTime = performance.now();
        return function (callback) {
          var now = performance.now();
          var delay = Math.max(0, frameDuration - (now - lastFrameTime));
          return setTimeout(function () {
            lastFrameTime = performance.now();
            callback(lastFrameTime);
          }, delay);
        };
      })();
    }
  </script>
</head>

<body>
  <div class="canvas-container">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <script type='text/javascript'>
    var Module = {
      // Persist saves/ (SRAM + snapshots) in IndexedDB. Mounted before
      // main() runs so RtlReadSram() sees the previous session's data.
      preRun: [function () {
        try { Module.FS.mkdir('/saves'); } catch (e) { }
        Module.FS.mount(Module.FS.filesystems.IDBFS, {}, '/saves');
        Module.addRunDependency('idbfs-load');
        Module.FS.syncfs(true, function (err) {
          if (err) console.error('IDBFS initial sync failed', err);
          Module.removeRunDependency('idbfs-load');
        });
      }],
      // All run dependencies (including the preloaded smw_assets.dat/smw.ini
      // package) are resolved by the time this fires, and main() has not run
      // yet: the right moment to rewrite the ini for the requested aspect.
      onRuntimeInitialized: function () {
        try {
          var ini = Module.FS.readFile('/smw.ini', { encoding: 'utf8' });
          ini = ini.replace(/^ExtendedAspectRatio *=.*$/m,
            'ExtendedAspectRatio = ' + __aspect.w + ':' + __aspect.h);
          Module.FS.writeFile('/smw.ini', ini);
        } catch (e) {
          console.error('aspect: smw.ini rewrite failed', e);
        }
      },
      canvas: (function () {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener("webglcontextlost", function (e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
        return canvas;
      })(),
      print: (function () {
        return function (text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.log(text);
        };
      })(),
      printErr: function (text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
        console.error(text);
      },
      setStatus: function (text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (m) {
          text = m[1];
        } else {
          if (!text) return;
        }
        console.log("Status: " + text);
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = function (event) {
      Module.setStatus('Exception thrown, see JavaScript console');
      Module.setStatus = function (text) {
        if (text) Module.printErr('[post-exception status] ' + text);
      };
    };

    // Flush saves/ to IndexedDB: SMW writes SRAM at in-game save points, so
    // a cheap periodic sync (plus one when the tab is hidden) is enough.
    setInterval(function () {
      if (Module.FS) Module.FS.syncfs(false, function () { });
    }, 3000);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden' && Module.FS) {
        Module.FS.syncfs(false, function () { });
      }
    });

    // Standard-layout gamepad → smw's default QWERTY keyboard bindings
    // (SNES: B=z A=x X=s Y=a L=c R=v, Start=Enter, Select=Right Shift).
    window.__gamepadKeyMap = {
      0: { key: 'z', code: 'KeyZ', keyCode: 90 },          // pad A (bottom) → SNES B (jump)
      1: { key: 'x', code: 'KeyX', keyCode: 88 },          // pad B (right)  → SNES A (spin)
      2: { key: 'a', code: 'KeyA', keyCode: 65 },          // pad X (left)   → SNES Y (run/carry)
      3: { key: 's', code: 'KeyS', keyCode: 83 },          // pad Y (top)    → SNES X
      4: { key: 'c', code: 'KeyC', keyCode: 67 },          // LB → SNES L
      5: { key: 'v', code: 'KeyV', keyCode: 86 },          // RB → SNES R
      8: { key: 'Shift', code: 'ShiftRight', keyCode: 16 }, // Select
      9: { key: 'Enter', code: 'Enter', keyCode: 13 },      // Start
      12: { key: 'ArrowUp', code: 'ArrowUp', keyCode: 38 },
      13: { key: 'ArrowDown', code: 'ArrowDown', keyCode: 40 },
      14: { key: 'ArrowLeft', code: 'ArrowLeft', keyCode: 37 },
      15: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 },
    };

    // No in-game dev menu: use the shared overlay's Escape mini-menu to get
    // back to the launcher (same mode as Sonic 3).
    window.__launcherReturnViaEscMenu = true;
  </script>
  <!-- Audio autoplay unlock + gamepad→keyboard translator + SDL2 gamepad
       proxy. Loaded synchronously (no defer/async) so its AudioContext and
       navigator.getGamepads hooks are installed before the engine runs. -->
  <script src="/shared/game-input.js"></script>
  <script src="/shared/launcher-overlay.js" defer></script>
  <script async type="text/javascript" src="index.js"></script>
</body>

</html>
