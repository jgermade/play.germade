[General]
# No snapshot autosave on the web: the browser never "quits" cleanly, so we
# rely on the game's own save points (SRAM), persisted via IDBFS.
Autosave = 0

# The web main loop is paced by requestAnimationFrame (plus a 60fps logic
# accumulator patched into main.c); SDL_Delay would busy-wait the browser.
DisableFrameDelay = 1

SavePlaythrough = 0

[Graphics]
WindowSize = Auto

Fullscreen = 0

# Canvas size = 3x (768x672); CSS scales it to the viewport from there.
WindowScale = 3

# Optimized PPU implementation.
NewRenderer = 1

IgnoreAspectRatio = 0

NoSpriteLimits = 1

# SDL renderer (the web build ships without the desktop OpenGL renderer).
OutputMethod = SDL

LinearFiltering = 0

[Sound]
EnableAudio = 1

# SPC/DSP native rate.
AudioFreq = 32000

AudioChannels = 2

AudioSamples = 512

[KeyMap]
# Order: Up, Down, Left, Right, Select, Start, A, B, X, Y, L, R
Controls = Up, Down, Left, Right, Right Shift, Return, x, z, s, a, c, v

CheatLife = w
CheatJump = Ctrl+q
ClearKeyLog = k
StopReplay = l
# Upstream default is Alt+Return, which collides with the shared launcher
# overlay's browser-fullscreen shortcut.
Fullscreen = Ctrl+f
Reset = Ctrl+r
Pause = Shift+p
PauseDimmed = p
Turbo = Tab
ReplayTurbo = t
WindowBigger = Ctrl+Up
WindowSmaller = Ctrl+Down
VolumeUp = Shift+=
VolumeDown = Shift+-
Load =      F1,     F2,     F3,     F4,     F5,     F6,     F7,     F8,     F9,     F10
Save = Shift+F1,Shift+F2,Shift+F3,Shift+F4,Shift+F5,Shift+F6,Shift+F7,Shift+F8,Shift+F9,Shift+F10
Replay= Ctrl+F1,Ctrl+F2,Ctrl+F3,Ctrl+F4,Ctrl+F5,Ctrl+F6,Ctrl+F7,Ctrl+F8,Ctrl+F9,Ctrl+F10

LoadRef = 1,2,3,4,5,6,7,8,9,0,-,=,Backspace
ReplayRef = Ctrl+1,Ctrl+2,Ctrl+3,Ctrl+4,Ctrl+5,Ctrl+6,Ctrl+7,Ctrl+8,Ctrl+9,Ctrl+0,Ctrl+-,Ctrl+=,Ctrl+Backspace

[GamepadMap]
# Gamepad input actually arrives via the shared gamepad→keyboard translator
# (game-input.js); SDL gamepads stay enabled as a harmless fallback.
EnableGamepad1 = true
EnableGamepad2 = true

Controls =   DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
ControlsP2 = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
