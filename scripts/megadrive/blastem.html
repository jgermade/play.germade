<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if ((localStorage.getItem('preferredGenesisCore') || 'jgenesis') !== 'blastem') {
            window.location.replace('index.html');
        }
    </script>
    <title>SEGA Megadrive — blastem</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <style>
        .hidden { visibility: hidden; }
        .cursor-hidden { cursor: none; }
        body { margin: 0; background-color: black; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; }
        canvas { width: 100vw; height: 100vh; object-fit: contain; margin: 0 !important; outline: none !important; }
        fieldset { margin-top: 10px; }
        input[type="checkbox"] { margin-top: 15px; }
        #loading-text { font-size: 60px; text-align: center; padding-top: 20vh; }
        #header-text, #jgenesis-rom-title, .jgenesis-controls { display: none !important; }
        #jgenesis { display: flex; flex-direction: row; justify-content: center; align-items: center; width: 100vw; height: 100vh; }
        #jgenesis-config { position: absolute; top: 60px; right: 20px; background: rgba(11, 12, 16, 0.95); padding: 20px; border: 2px solid #45a29e; border-radius: 8px; z-index: 100; max-height: 80vh; overflow-y: auto; }
        .darken { opacity: 0.5; }
        .rom-item { padding: 10px 14px; cursor: pointer; transition: background 0.15s; font-size: 0.95rem; border-radius: 6px; color: white; }
        .rom-item:hover { background: rgba(102, 252, 241, 0.15); }
        .rom-item.selected { background: rgba(102, 252, 241, 0.25); color: #66fcf1; font-weight: bold; }
        .rom-item.loading { opacity: 0.5; pointer-events: none; }
        #settings-toggle { position: fixed; top: 15px; right: 15px; z-index: 101; padding: 8px 16px; background: rgba(11, 12, 16, 0.85); color: #66fcf1; border: 2px solid #66fcf1; border-radius: 6px; cursor: pointer; font-size: 0.9rem; opacity: 0.5; transition: opacity 0.2s; }
        #settings-toggle:hover { opacity: 1; }
        #game-gallery { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; align-items: center; width: 100vw; height: 100vh; overflow-y: auto; background: #0b0c10; padding: 50px; box-sizing: border-box; position: absolute; top: 0; left: 0; z-index: 50; }
        .cover-item { width: 200px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .cover-item:hover { transform: translateY(-5px) scale(1.02); }
        .cover-item img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); border: 2px solid transparent; transition: border-color 0.2s; }
        .cover-item:hover img { border-color: #66fcf1; box-shadow: 0 8px 20px rgba(102, 252, 241, 0.3); }
        .cover-item .title { margin-top: 12px; color: white; font-size: 1rem; font-weight: bold; text-shadow: 1px 1px 2px black; }
    </style>
</head>
<body>
    <div id="loading-text">Loading...</div>
    <div id="game-gallery" style="display: none;"></div>
    <div id="jgenesis" class="hidden">
        <div id="jgenesis-wasm-and-controls">
            <canvas id="jgenesis-wasm" oncontextmenu="event.preventDefault()"></canvas>
        </div>
        <div id="jgenesis-config" class="hide-fullscreen" style="display:none;">
            <div id="jgenesis-config-close" style="position: absolute; top: 10px; right: 10px; cursor: pointer; color: #66fcf1; font-size: 1.5rem;">&times;</div>
            <fieldset style="margin-bottom: 20px; border-color: #66fcf1; padding: 10px;">
                <legend style="color: #66fcf1; font-weight: bold;">Emulator Engine</legend>
                <select id="engine-selector" style="width: 100%; padding: 8px; background: #111; color: white; border: 1px solid #45a29e; border-radius: 4px; font-size: 1rem; cursor: pointer;">
                    <option value="jgenesis">JGenesis (Cycle-accurate)</option>
                    <option value="blastem" selected>BlastEm (High performance)</option>
                </select>
                <div style="font-size: 0.8rem; color: #8b8e98; margin-top: 5px;">Selecting a different engine will reload the page.</div>
            </fieldset>
            <div id="supported-files-info" style="margin-top:10px;">
                <p>Engine: BlastEm WASM</p>
            </div>
        </div>
    </div>

    <!-- Launcher overlay -->
    <script>window.__launcherReturnViaEscMenu = true;</script>
    <script src="/shared/launcher-overlay.js" defer></script>

    <!-- Load BlastEm runtime JS -->
    <script>
// === ROM list UI ===
const CONSOLE = window.JGENESIS_CONSOLE || "megadrive";
let romListItems = [];
let selectedRomIdx = -1;

var Module = {
    canvas: document.getElementById('jgenesis-wasm'), // We'll rename it or keep id
    print: function(text) { console.log(text); },
    printErr: function(text) { console.error(text); },
    onRuntimeInitialized: function() {
        console.log("BlastEm initialized!");
        document.getElementById('loading-text').style.display = 'none';
        
        // Show gallery if no ROM is selected
        if (selectedRomIdx === -1) {
            const gallery = document.getElementById('game-gallery');
            if (gallery) gallery.style.display = 'flex';
        }
    }
};

async function loadRomList() {
    try {
        const res = await fetch(`/roms/roms.${CONSOLE}.json`);
        if (!res.ok) {
            console.warn(`roms.${CONSOLE}.json not found — ROM list will be empty`);
            return;
        }
        romListItems = await res.json();
        renderRomList();
    } catch (e) {
        console.warn('Failed to load ROM list:', e);
    }
}

function renderRomList() {
    const container = document.getElementById('rom-list-items');
    const gallery = document.getElementById('game-gallery');
    
    if (container) container.innerHTML = '';
    if (gallery) gallery.innerHTML = '';

    romListItems.forEach((rom, idx) => {
        // ESC Menu item
        if (container) {
            const item = document.createElement('div');
            item.className = 'rom-item' + (idx === selectedRomIdx ? ' selected' : '');
            item.textContent = rom.title;
            item.tabIndex = 0;
            item.addEventListener('click', () => selectRom(idx));
            container.appendChild(item);
        }

        // Gallery cover item
        if (gallery) {
            const coverItem = document.createElement('div');
            coverItem.className = 'cover-item';
            
            const placeholderSvg = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='266' fill='%231f2833'%3E%3Crect width='100%25' height='100%25'/%3E%3Ctext x='50%25' y='50%25' font-family='sans-serif' font-size='16' fill='%23c5c6c7' text-anchor='middle' dy='.3em'%3ENo Cover%3C/text%3E%3C/svg%3E";
            const coverUrl = rom.cover ? rom.cover : placeholderSvg;

            coverItem.innerHTML = `
                <img src="${coverUrl}" alt="${rom.title}" onerror="this.src='${placeholderSvg}'">
                <div class="title">${rom.title}</div>
            `;
            coverItem.addEventListener('click', () => {
                gallery.style.display = 'none';
                selectRom(idx);
            });
            gallery.appendChild(coverItem);
        }
    });
}

async function selectRom(idx) {
    if (idx < 0 || idx >= romListItems.length) return;
    const rom = romListItems[idx];
    selectedRomIdx = idx;
    renderRomList();

    document.querySelectorAll('.rom-item').forEach(el => el.classList.add('loading'));

    try {
        const cacheBuster = `?v=${new Date().getTime()}`;
        const res = await fetch(rom.url + cacheBuster);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const arrayBuffer = await res.arrayBuffer();
        const romBytes = new Uint8Array(arrayBuffer);
        
        // Write to Emscripten FS and tell BlastEm to load it
        try {
            Module.FS.mkdir('/roms');
        } catch(e) {} // Ignore if exists
        
        const path = '/roms/' + rom.filename;
        Module.FS.writeFile(path, romBytes);
        
        // Call BlastEm handle_chooser_result(1, path)
        Module.ccall('handle_chooser_result', 'void', ['number', 'string'], [1, path]);

        // Hide jgenesis/blastem hidden element and reveal it
        document.getElementById('jgenesis').classList.remove('hidden');

        // Close ESC menu if open
        if (window.isDevMenuOpen && window.isDevMenuOpen()) {
            window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
        }
    } catch (e) {
        alert('Failed to load ROM: ' + e.message);
    } finally {
        document.querySelectorAll('.rom-item').forEach(el => el.classList.remove('loading'));
    }
}

// Inject Settings button and ROM list into ESC menu
const escPanel = document.getElementById('launcher-esc-menu-panel');
if (escPanel) {
    const settingsBtn = document.createElement('div');
    settingsBtn.id = 'esc-settings-btn';
    settingsBtn.style.color = '#66fcf1';
    settingsBtn.style.background = 'rgba(102, 252, 241, 0.15)';
    settingsBtn.style.padding = '8px 14px';
    settingsBtn.style.borderRadius = '6px';
    settingsBtn.style.cursor = 'pointer';
    settingsBtn.style.fontSize = '1rem';
    settingsBtn.style.marginTop = '15px';
    settingsBtn.textContent = '⚙ Emulator Settings';
    settingsBtn.tabIndex = 0;
    settingsBtn.addEventListener('click', () => {
        document.getElementById('jgenesis-config').style.display = 'block';
        if (window.isDevMenuOpen && window.isDevMenuOpen()) {
            window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
        }
    });
    escPanel.appendChild(settingsBtn);

    const romContainer = document.createElement('div');
    romContainer.id = 'esc-rom-list';
    romContainer.style.marginTop = '20px';
    romContainer.style.borderTop = '1px solid #1f2833';
    romContainer.style.paddingTop = '15px';
    romContainer.innerHTML = '<div style="color:#66fcf1;font-weight:bold;font-size:1.1rem;margin-bottom:10px;">Select ROM</div><div id="rom-list-items" style="max-height:40vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;"></div>';
    escPanel.appendChild(romContainer);
}

document.getElementById('jgenesis-config-close').addEventListener('click', () => {
    document.getElementById('jgenesis-config').style.display = 'none';
});

document.getElementById('engine-selector').addEventListener('change', (e) => {
    const engine = e.target.value;
    localStorage.setItem('preferredGenesisCore', engine);
    window.location.href = `/console/${engine}/`;
});

loadRomList();

// Ensure engine selector shows correct core
document.getElementById('engine-selector').value = 'blastem';


</script>
    <script async src="/console/shared/blastem/blastem.js"></script>
</body>
</html>
